name: Compilar Turbo Racing

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear estructura Android
        run: flutter create --platforms=android --project-name turbo_racing .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze --no-pub

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Racing-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
